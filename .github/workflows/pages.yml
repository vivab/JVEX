name: Publish JVEX
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate JVEX files
        shell: bash
        run: |
          test -s index.html
          test -s worker/src/index.js
          node --check worker/src/index.js
          node --check worker/src/quotas.js
          node --test worker/test/index.test.js
          python3 - <<'PY'
          from pathlib import Path
          s = Path("index.html").read_text()
          assert "<title>JVEX AI</title>" in s
          assert "id=\"codeMode\"" in s
          assert "id=\"plansBackdrop\"" in s
          assert "id=\"repoBar\"" not in s
          assert "<script>" in s
          Path("/tmp/jvex-ui.js").write_text(s.split("<script>",1)[1].split("</script>",1)[0])
          PY
          node --check /tmp/jvex-ui.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
