name: Inspect JVEX Groq models and limits
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/groq-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Groq model IDs and limits
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/inspect-groq.mjs
      - name: Report model inventory result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_RESULT: ${{ job.status }}
        run: |
          if [ "$JOB_RESULT" = "success" ]; then state=success; else state=failure; fi
          jq -nc --arg state "$state" --arg target "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:"JVEX / Groq inventory",description:"Groq catalog and quota probe",target_url:$target}' > /tmp/inventory-status.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" --data-binary @/tmp/inventory-status.json "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" > /dev/null
