name: Deploy JVEX API (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Worker
        run: |
          node --check worker/src/index.js
          node --test worker/test/index.test.js
      - name: Require anonymous quota salt and at least one AI key
        env:
          QUOTA_SALT: ${{ secrets.QUOTA_SALT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test "${#QUOTA_SALT}" -ge 16 || { echo "Missing QUOTA_SALT (min 16 characters)"; exit 1; }
          test -n "$GROQ_API_KEY$OPENROUTER_API_KEY$GEMINI_API_KEY" || { echo "Missing AI provider key"; exit 1; }
      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
      - name: Upload only configured Worker secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JVEX_ACCESS_CODE: ${{ secrets.JVEX_ACCESS_CODE }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        shell: bash
        run: |
          for secret in QUOTA_SALT GROQ_API_KEY OPENROUTER_API_KEY GEMINI_API_KEY TAVILY_API_KEY; do
            value="${!secret}"
            if [[ -n "$value" ]]; then
              printf '%s' "$value" | npx --yes wrangler@4 secret put "$secret" --name jvex-api
            fi
          done
