name: Deploy JVEX API (manual)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Worker
        run: |
          node --check worker/src/index.js
          node --check assets/format.js
          node --test worker/test/*.test.js
      - name: Verify Cloudflare credentials and at least one AI key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '2c733b431e7f0e27e7275fcae75a26ee' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$GROQ_API_KEY$OPENROUTER_API_KEY$GEMINI_API_KEY" || { echo "Missing AI provider key"; exit 1; }
      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '2c733b431e7f0e27e7275fcae75a26ee' }}
          workingDirectory: worker
      - name: Upload only configured Worker secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '2c733b431e7f0e27e7275fcae75a26ee' }}
          QUOTA_SALT: ${{ secrets.QUOTA_SALT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$QUOTA_SALT" ]]; then
            # Stable across deployments while the Cloudflare token is unchanged.
            # Derive a separate secret, never expose the token or derived salt in logs.
            QUOTA_SALT=$(node -e 'const c=require("node:crypto");process.stdout.write(c.createHmac("sha256",process.env.CLOUDFLARE_API_TOKEN).update("JVEX-anon-v1:"+process.env.CLOUDFLARE_ACCOUNT_ID).digest("hex"))')
          fi
          for secret in QUOTA_SALT GROQ_API_KEY OPENROUTER_API_KEY GEMINI_API_KEY TAVILY_API_KEY; do
            value="${!secret}"
            if [[ -n "$value" ]]; then
              printf '%s' "$value" | npx --yes wrangler@4 secret put "$secret" --name jvex-api
            fi
          done
      - name: Verify live JVEX chat with Groq
        run: node scripts/test-live-jvex.mjs
      - name: Report Cloudflare deployment outcome
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_RESULT: ${{ job.status }}
        run: |
          if [ "$JOB_RESULT" = "success" ]; then state=success; else state=failure; fi
          jq -nc --arg state "$state" \
            --arg target "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:"JVEX / API deployment",description:"Cloudflare API deployment",target_url:$target}' > /tmp/deploy-status.json
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/deploy-status.json \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" > /dev/null
