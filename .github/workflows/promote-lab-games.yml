name: Publish extra playable JVEX game tests
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-lab-games.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
  statuses: write
concurrency:
  group: jvex-game-promotion
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download actual JVEX-generated Pong and Qwen Snake
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/13664764802/zip" -o /tmp/jvex-lab.zip
          mkdir -p /tmp/jvex-lab-source
          unzip -q /tmp/jvex-lab.zip -d /tmp/jvex-lab-source
      - name: Install independent browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Launch and check Pong and Qwen Snake on mobile
        run: |
          node --check scripts/promote-lab-games.mjs
          node scripts/promote-lab-games.mjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvex-pong-qwen-game-screenshots
          path: game-promo-results/
          if-no-files-found: ignore
      - name: Commit only verified games to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play/data/pong.json play/data/snake-qwen.json
          git commit -m "Publish browser-tested JVEX Pong and Qwen Snake game variants"
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public playable game links in real browser
        run: |
          node --input-type=module - <<'JS'
          import {chromium} from "playwright";
          const browser=await chromium.launch({headless:true,args:["--no-sandbox"]});
          try{
            for(const game of ["pong","snake-qwen","snake","breakout"]){
              let ok=false;
              for(let attempt=0;attempt<8;attempt++){
                const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
                try{
                  await page.goto("https://vivab.github.io/JVEX/play/?g="+game,{waitUntil:"domcontentloaded",timeout:20000});
                  await page.locator("#message[hidden]").waitFor({state:"attached",timeout:6000});
                  await page.frameLocator("#frame").locator("canvas").waitFor({state:"attached",timeout:6000});
                  console.log("LIVE_GAME_OK "+game);
                  ok=true;
                }catch(error){console.log("LIVE_GAME_RETRY "+game+" "+String(error.message).slice(0,80));await new Promise(r=>setTimeout(r,3500))}
                finally{await page.close()}
                if(ok)break;
              }
              if(!ok)throw Error("Live JVEX game inaccessible: "+game);
            }
          }finally{await browser.close()}
          JS
      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = "success" ]; then state=success; else state=failure; fi
          jq -nc --arg state "$state" --arg target "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:"JVEX / Extra playable games",description:"Real JVEX game files, mobile browser verified",target_url:$target}' > /tmp/games-report.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" --data-binary @/tmp/games-report.json "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" > /dev/null
