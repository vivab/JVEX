name: Test JVEX Groq API
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/groq-test.yml'
      - 'scripts/test-groq.mjs'
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Вопрос для JVEX (виден в логах теста)'
        required: false
        type: string
        default: 'Привет! Представься как JVEX.'
permissions:
  contents: read
  statuses: write
concurrency:
  group: groq-test
  cancel-in-progress: false
jobs:
  groq-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check scripts/test-groq.mjs
      - name: Test Groq with repository secret
        id: groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JVEX_TEST_PROMPT: ${{ inputs.prompt }}
        run: node scripts/test-groq.mjs
      - name: Report test result to commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_STEP: ${{ steps.groq.outcome }}
        run: |
          if [ "$GROQ_STEP" = "success" ]; then state=success; else state=failure; fi
          jq -nc --arg state "$state" \
            --arg target "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:"JVEX / Groq smoke",description:"Real Groq API connection test",target_url:$target}' > /tmp/groq-status.json
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/groq-status.json \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" > /dev/null
